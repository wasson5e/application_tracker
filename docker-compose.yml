services:
  db:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      start_period: 30s
      interval: 10s
      timeout: 10s
      retries: 5

  api:
    build: ./api
    env_file: .env
    expose:
      - "${API_PORT}"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build: ./ui
    env_file: .env
    ports:
      - "${UI_PORT}:80"
    depends_on:
      - api

volumes:
  mongo_data:
